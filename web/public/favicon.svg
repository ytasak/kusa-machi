<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="クサマチ">
  <title>クサマチ</title>

  <defs>
    <!-- ネオンの発光。落とされても形は読めるので、あくまで上乗せ。 -->
    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- kusa のアイコンに合わせた黒地の角丸スクエア -->
  <rect width="512" height="512" rx="116" fill="#08080a" />

  <g filter="url(#neon)">
    <!-- ハート -->
    <path
      transform="translate(42 90) scale(12.5)"
      d="M12 21.7 10.5 20.3C5.4 15.6 2 12.5 2 8.7 2 5.9 4.2 3.7 7 3.7c1.6 0 3.1.7 4 1.9.9-1.2 2.4-1.9 4-1.9 2.8 0 5 2.2 5 5 0 3.8-3.4 6.9-8.5 11.6L12 21.7z"
      fill="none"
      stroke="#ff2d95"
      stroke-width="2.2"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- 右側へ散っていくピクセル。kusa のアイコンの崩れ方を踏襲している。 -->
    <g fill="#ff2d95">
      <rect x="312" y="158" width="26" height="26" rx="4" />
      <rect x="348" y="196" width="25" height="25" rx="4" />
      <rect x="310" y="234" width="25" height="25" rx="4" opacity="0.95" />
      <rect x="352" y="268" width="23" height="23" rx="4" opacity="0.88" />
      <rect x="314" y="308" width="22" height="22" rx="4" opacity="0.82" />
      <rect x="386" y="146" width="21" height="21" rx="4" opacity="0.82" />
      <rect x="388" y="230" width="21" height="21" rx="4" opacity="0.75" />
      <rect x="358" y="338" width="19" height="19" rx="3" opacity="0.66" />
      <rect x="418" y="188" width="18" height="18" rx="3" opacity="0.62" />
      <rect x="414" y="282" width="17" height="17" rx="3" opacity="0.54" />
      <rect x="396" y="368" width="15" height="15" rx="3" opacity="0.44" />
      <rect x="448" y="228" width="14" height="14" rx="3" opacity="0.42" />
      <rect x="442" y="326" width="13" height="13" rx="3" opacity="0.34" />
      <rect x="452" y="160" width="12" height="12" rx="3" opacity="0.32" />
      <rect x="466" y="268" width="11" height="11" rx="3" opacity="0.26" />
      <rect x="424" y="122" width="11" height="11" rx="3" opacity="0.26" />
      <rect x="458" y="372" width="10" height="10" rx="3" opacity="0.2" />
    </g>
  </g>

  <!-- 文字だけは発光をかけずに乗せる。小さいサイズでも輪郭が残るように。 -->
  <text
    x="192"
    y="232"
    text-anchor="middle"
    dominant-baseline="middle"
    fill="#ff5cae"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="60"
    font-weight="800"
    letter-spacing="-1.5"
  >kusa</text>
</svg>
