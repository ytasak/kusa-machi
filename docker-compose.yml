# ローカル開発用のデータベース専用。以下の認証情報は、開発機の外に公開しない
# コンテナのための使い捨ての値。
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kusa
      POSTGRES_PASSWORD: kusa
      POSTGRES_DB: kusamachi
      TZ: Asia/Tokyo
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kusa -d kusamachi']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
